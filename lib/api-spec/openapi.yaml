openapi: 3.1.0
info: {title: Api, version: 0.1.0}
servers: [{url: /api}]
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthStatus"}
  /saqfi/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
    post:
      operationId: loginDemo
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DemoInput"}
      responses:
        "200":
          description: Demo signed in
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
    delete:
      operationId: logout
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /saqfi/state:
    get:
      operationId: getClubState
      responses:
        "200":
          description: Role-filtered club snapshot; amounts are KWD, three decimal precision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClubState"}
  /saqfi/budget:
    put:
      operationId: saveBudget
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BudgetInput"}
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /saqfi/contracts:
    post:
      operationId: createContract
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ContractInput"}
      responses:
        "201":
          description: Contract created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /saqfi/expenses:
    post:
      operationId: createExpense
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExpenseInput"}
      responses:
        "201":
          description: Expense recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /saqfi/payroll:
    post:
      operationId: runPayroll
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PayrollInput"}
      responses:
        "201":
          description: Payroll recorded, not a bank transfer
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties: {status: {type: string}}
    Message:
      type: object
      required: [message]
      properties: {message: {type: string}}
    DemoInput:
      type: object
      required: [role]
      properties:
        role: {type: string, enum: [manager, president, player]}
    Session:
      type: object
      required: [authenticated, role, name, demo]
      properties:
        authenticated: {type: boolean}
        role: {type: string}
        name: {type: string}
        demo: {type: boolean}
    Category:
      type: object
      required: [id, name, nameEn, cap, spent, committed, remaining]
      properties:
        id: {type: string}
        name: {type: string}
        nameEn: {type: string}
        cap: {type: number}
        spent: {type: number}
        committed: {type: number}
        remaining: {type: number}
    CategoryInput:
      type: object
      required: [id, cap]
      properties:
        id: {type: string}
        cap: {type: number, minimum: 0}
    BudgetInput:
      type: object
      required: [total, categories]
      properties:
        total: {type: number, minimum: 1}
        categories: {type: array, items: {$ref: "#/components/schemas/CategoryInput"}}
    ContractInput:
      type: object
      required: [name, nameEn, position, salary, start, end]
      properties:
        name: {type: string, minLength: 2}
        nameEn: {type: string, minLength: 2}
        position: {type: string}
        salary: {type: number, exclusiveMinimum: 0}
        start: {type: string}
        end: {type: string}
    Contract:
      allOf:
        - {$ref: "#/components/schemas/ContractInput"}
        - type: object
          required: [id, totalCost, outstanding]
          properties:
            id: {type: string}
            totalCost: {type: number}
            outstanding: {type: number}
    ExpenseInput:
      type: object
      required: [categoryId, amount, description, date]
      properties:
        categoryId: {type: string}
        amount: {type: number, exclusiveMinimum: 0}
        description: {type: string, minLength: 2}
        date: {type: string}
    Transaction:
      type: object
      required: [id, categoryId, amount, description, date, type]
      properties:
        id: {type: string}
        categoryId: {type: string}
        amount: {type: number}
        description: {type: string}
        date: {type: string}
        type: {type: string}
    PayrollInput:
      type: object
      required: [month]
      properties:
        month: {type: string, pattern: '^\d{4}-\d{2}$'}
    PayrollLine:
      type: object
      required: [playerId, name, salary, bonus, fine, net]
      properties:
        playerId: {type: string}
        name: {type: string}
        salary: {type: number}
        bonus: {type: number}
        fine: {type: number}
        net: {type: number}
    Payroll:
      type: object
      required: [id, month, total, paidAt, lines]
      properties:
        id: {type: string}
        month: {type: string}
        total: {type: number}
        paidAt: {type: string}
        lines: {type: array, items: {$ref: "#/components/schemas/PayrollLine"}}
    Alert:
      type: object
      required: [id, type, message, messageEn]
      properties:
        id: {type: string}
        type: {type: string}
        message: {type: string}
        messageEn: {type: string}
    Trend:
      type: object
      required: [month, amount]
      properties:
        month: {type: string}
        amount: {type: number}
    ClubState:
      type: object
      required: [club, clubEn, seasonStart, seasonEnd, totalBudget, mode, categories, contracts, payrolls, transactions, alerts, trend, spent, committed, remaining, forecast, monthlyPayroll, nextPayrollMonth, today]
      properties:
        club: {type: string}
        clubEn: {type: string}
        seasonStart: {type: string}
        seasonEnd: {type: string}
        totalBudget: {type: number}
        mode: {type: string, enum: [demo, database]}
        categories: {type: array, items: {$ref: "#/components/schemas/Category"}}
        contracts: {type: array, items: {$ref: "#/components/schemas/Contract"}}
        payrolls: {type: array, items: {$ref: "#/components/schemas/Payroll"}}
        transactions: {type: array, items: {$ref: "#/components/schemas/Transaction"}}
        alerts: {type: array, items: {$ref: "#/components/schemas/Alert"}}
        trend: {type: array, items: {$ref: "#/components/schemas/Trend"}}
        spent: {type: number}
        committed: {type: number}
        remaining: {type: number}
        forecast: {type: number}
        monthlyPayroll: {type: number}
        nextPayrollMonth: {type: string}
        today: {type: string}
