openapi: 3.1.0
info: {title: Api, version: 0.1.0}
servers: [{url: /api}]
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthStatus"}
  /saqfi/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
    post:
      operationId: loginDemo
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DemoInput"}
      responses:
        "200":
          description: Demo signed in
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
    delete:
      operationId: logout
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /saqfi/state:
    get:
      operationId: getClubState
      responses:
        "200":
          description: Role-filtered club snapshot; amounts are KWD, three decimal precision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClubState"}
  /saqfi/budget:
    put:
      operationId: saveBudget
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BudgetInput"}
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /saqfi/contracts:
    post:
      operationId: createContract
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ContractInput"}
      responses:
        "201":
          description: Contract created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /saqfi/expenses:
    post:
      operationId: createExpense
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExpenseInput"}
      responses:
        "201":
          description: Expense recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /saqfi/payroll:
    post:
      operationId: runPayroll
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PayrollInput"}
      responses:
        "201":
          description: Payroll recorded, not a bank transfer
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /saqfi/matches:
    post:
      operationId: createMatch
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MatchInput"}
      responses:
        "201":
          description: Match recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /saqfi/adjustments:
    post:
      operationId: createAdjustment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdjustmentInput"}
      responses:
        "201":
          description: Bonus or fine recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /saqfi/adjustments/{id}:
    delete:
      operationId: deleteAdjustment
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /saqfi/bonus-rules:
    put:
      operationId: saveBonusRules
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BonusRules"}
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /saqfi/approval-threshold:
    put:
      operationId: saveApprovalThreshold
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ThresholdInput"}
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /saqfi/requests:
    post:
      operationId: createRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExpenseInput"}
      responses:
        "201":
          description: Sent for approval
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /saqfi/requests/{id}/decision:
    post:
      operationId: decideRequest
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DecisionInput"}
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /saqfi/advisor:
    post:
      operationId: askAdvisor
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdvisorInput"}
      responses:
        "200":
          description: Advice
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdvisorAnswer"}
  /saqfi/rates:
    get:
      operationId: getRates
      responses:
        "200":
          description: Live exchange rates, base KWD
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Rates"}
  /saqfi/payments/checkout:
    post:
      operationId: startCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CheckoutInput"}
      responses:
        "201":
          description: Payment created; open url (Stripe) or confirm in the sandbox
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CheckoutResult"}
  /saqfi/payments/{id}/confirm:
    post:
      operationId: confirmPayment
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConfirmInput"}
      responses:
        "200":
          description: Payment verified and applied
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /saqfi/payments/{id}/cancel:
    post:
      operationId: cancelPayment
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConfirmInput"}
      responses:
        "200":
          description: Payment cancelled
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /saqfi/wallet/withdraw:
    post:
      operationId: withdrawWallet
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WithdrawInput"}
      responses:
        "201":
          description: Withdrawal recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /saqfi/invoices:
    post:
      operationId: createInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InvoiceInput"}
      responses:
        "201":
          description: Invoice created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /saqfi/invoices/{id}/void:
    post:
      operationId: voidInvoice
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConfirmInput"}
      responses:
        "200":
          description: Invoice voided
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /saqfi/wallet/advance:
    post:
      operationId: requestAdvance
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WithdrawInput"}
      responses:
        "201":
          description: Advance paid into the wallet
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /saqfi/public/invoices/{id}/{token}:
    get:
      operationId: getPublicInvoice
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Invoice as the sponsor sees it
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicInvoice"}
  /saqfi/public/invoices/{id}/checkout:
    post:
      operationId: checkoutPublicInvoice
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PublicCheckoutInput"}
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CheckoutResult"}
  /saqfi/public/invoices/{id}/confirm:
    post:
      operationId: confirmPublicInvoice
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PublicConfirmInput"}
      responses:
        "200":
          description: Invoice paid
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties: {status: {type: string}}
    Message:
      type: object
      required: [message]
      properties: {message: {type: string}, pending: {type: boolean}}
    DemoInput:
      type: object
      required: [role]
      properties:
        role: {type: string, enum: [manager, president, player]}
    Session:
      type: object
      required: [authenticated, role, name, demo]
      properties:
        authenticated: {type: boolean}
        role: {type: string}
        name: {type: string}
        demo: {type: boolean}
    Category:
      type: object
      required: [id, name, nameEn, cap, spent, committed, remaining]
      properties:
        id: {type: string}
        name: {type: string}
        nameEn: {type: string}
        cap: {type: number}
        spent: {type: number}
        committed: {type: number}
        remaining: {type: number}
    CategoryInput:
      type: object
      required: [id, cap]
      properties:
        id: {type: string}
        cap: {type: number, minimum: 0}
    BudgetInput:
      type: object
      required: [total, categories]
      properties:
        total: {type: number, minimum: 1}
        categories: {type: array, items: {$ref: "#/components/schemas/CategoryInput"}}
    ContractInput:
      type: object
      required: [name, nameEn, position, salary, start, end]
      properties:
        name: {type: string, minLength: 2}
        nameEn: {type: string, minLength: 2}
        position: {type: string}
        salary: {type: number, exclusiveMinimum: 0}
        start: {type: string}
        end: {type: string}
    Contract:
      allOf:
        - {$ref: "#/components/schemas/ContractInput"}
        - type: object
          required: [id, totalCost, outstanding, pendingBonus, pendingFine]
          properties:
            id: {type: string}
            totalCost: {type: number}
            outstanding: {type: number}
            pendingBonus: {type: number}
            pendingFine: {type: number}
    ExpenseInput:
      type: object
      required: [categoryId, amount, description, date]
      properties:
        categoryId: {type: string}
        amount: {type: number, exclusiveMinimum: 0}
        description: {type: string, minLength: 2}
        date: {type: string}
        currency: {type: string}
    Transaction:
      type: object
      required: [id, categoryId, amount, description, date, type]
      properties:
        id: {type: string}
        categoryId: {type: string}
        amount: {type: number}
        description: {type: string}
        date: {type: string}
        type: {type: string}
        currency: {type: string}
        originalAmount: {type: number}
        rate: {type: number}
    PayrollInput:
      type: object
      required: [month]
      properties:
        month: {type: string, pattern: '^\d{4}-\d{2}$'}
    PayrollLine:
      type: object
      required: [playerId, name, salary, bonus, fine, net]
      properties:
        playerId: {type: string}
        name: {type: string}
        salary: {type: number}
        bonus: {type: number}
        fine: {type: number}
        advance: {type: number}
        net: {type: number}
    Payroll:
      type: object
      required: [id, month, total, paidAt, lines]
      properties:
        id: {type: string}
        month: {type: string}
        total: {type: number}
        paidAt: {type: string}
        lines: {type: array, items: {$ref: "#/components/schemas/PayrollLine"}}
    Alert:
      type: object
      required: [id, type, message, messageEn]
      properties:
        id: {type: string}
        type: {type: string}
        message: {type: string}
        messageEn: {type: string}
    Trend:
      type: object
      required: [month, amount]
      properties:
        month: {type: string}
        amount: {type: number}
    ClubState:
      type: object
      required: [club, clubEn, seasonStart, seasonEnd, totalBudget, mode, categories, contracts, payrolls, transactions, alerts, trend, spent, committed, remaining, forecast, monthlyPayroll, nextPayrollMonth, today, adjustments, matches, bonusRules, approvalThreshold, requests, audit, pendingBonuses, pendingFines, insights, market, payments, wallet, gateway, invoices, installments, advances, income]
      properties:
        club: {type: string}
        clubEn: {type: string}
        seasonStart: {type: string}
        seasonEnd: {type: string}
        totalBudget: {type: number}
        mode: {type: string, enum: [demo, database]}
        categories: {type: array, items: {$ref: "#/components/schemas/Category"}}
        contracts: {type: array, items: {$ref: "#/components/schemas/Contract"}}
        payrolls: {type: array, items: {$ref: "#/components/schemas/Payroll"}}
        transactions: {type: array, items: {$ref: "#/components/schemas/Transaction"}}
        alerts: {type: array, items: {$ref: "#/components/schemas/Alert"}}
        trend: {type: array, items: {$ref: "#/components/schemas/Trend"}}
        spent: {type: number}
        committed: {type: number}
        remaining: {type: number}
        forecast: {type: number}
        monthlyPayroll: {type: number}
        nextPayrollMonth: {type: string}
        today: {type: string}
        adjustments: {type: array, items: {$ref: "#/components/schemas/Adjustment"}}
        matches: {type: array, items: {$ref: "#/components/schemas/Match"}}
        bonusRules: {$ref: "#/components/schemas/BonusRules"}
        approvalThreshold: {type: number}
        requests: {type: array, items: {$ref: "#/components/schemas/ApprovalRequest"}}
        audit: {type: array, items: {$ref: "#/components/schemas/AuditEntry"}}
        pendingBonuses: {type: number}
        pendingFines: {type: number}
        insights: {type: array, items: {$ref: "#/components/schemas/Insight"}}
        market: {type: array, items: {$ref: "#/components/schemas/Listing"}}
        payments: {type: array, items: {$ref: "#/components/schemas/Payment"}}
        wallet: {$ref: "#/components/schemas/Wallet"}
        gateway: {type: string, enum: [stripe, sandbox]}
        invoices: {type: array, items: {$ref: "#/components/schemas/Invoice"}}
        installments: {type: array, items: {$ref: "#/components/schemas/Installment"}}
        advances: {type: array, items: {$ref: "#/components/schemas/Advance"}}
        income: {type: number}
    Adjustment:
      type: object
      required: [id, playerId, kind, amount, reason, date]
      properties:
        id: {type: string}
        playerId: {type: string}
        kind: {type: string, enum: [bonus, fine]}
        amount: {type: number}
        reason: {type: string}
        date: {type: string}
        matchId: {type: string}
        settledMonth: {type: string}
    AdjustmentInput:
      type: object
      required: [playerId, kind, amount, reason, date]
      properties:
        playerId: {type: string}
        kind: {type: string, enum: [bonus, fine]}
        amount: {type: number, exclusiveMinimum: 0}
        reason: {type: string, minLength: 2}
        date: {type: string}
    Match:
      type: object
      required: [id, date, opponent, opponentEn, home, goalsFor, goalsAgainst, competition, result, bonusPlayers, bonusTotal]
      properties:
        id: {type: string}
        date: {type: string}
        opponent: {type: string}
        opponentEn: {type: string}
        home: {type: boolean}
        goalsFor: {type: integer}
        goalsAgainst: {type: integer}
        competition: {type: string}
        result: {type: string, enum: [W, D, L]}
        bonusPlayers: {type: integer}
        bonusTotal: {type: number}
    MatchInput:
      type: object
      required: [date, opponent, opponentEn, home, goalsFor, goalsAgainst, competition, playerIds]
      properties:
        date: {type: string}
        opponent: {type: string, minLength: 2}
        opponentEn: {type: string}
        home: {type: boolean}
        goalsFor: {type: integer, minimum: 0, maximum: 30}
        goalsAgainst: {type: integer, minimum: 0, maximum: 30}
        competition: {type: string}
        playerIds: {type: array, items: {type: string}}
    BonusRules:
      type: object
      required: [win, draw]
      properties:
        win: {type: number, minimum: 0}
        draw: {type: number, minimum: 0}
    ThresholdInput:
      type: object
      required: [threshold]
      properties:
        threshold: {type: number, minimum: 0}
    ApprovalRequest:
      type: object
      required: [id, categoryId, amount, description, date, status, reason, requestedAt]
      properties:
        id: {type: string}
        categoryId: {type: string}
        amount: {type: number}
        description: {type: string}
        date: {type: string}
        status: {type: string, enum: [pending, approved, rejected]}
        reason: {type: string, enum: [threshold, cap]}
        requestedAt: {type: string}
        decidedAt: {type: string}
        note: {type: string}
        fromReserve: {type: number}
        currency: {type: string}
        originalAmount: {type: number}
        rate: {type: number}
    DecisionInput:
      type: object
      required: [approve]
      properties:
        approve: {type: boolean}
        note: {type: string}
    AuditEntry:
      type: object
      required: [id, at, role, action, detail, detailEn]
      properties:
        id: {type: string}
        at: {type: string}
        role: {type: string}
        action: {type: string}
        detail: {type: string}
        detailEn: {type: string}
    Insight:
      type: object
      required: [id, message, messageEn, tone]
      properties:
        id: {type: string}
        message: {type: string}
        messageEn: {type: string}
        tone: {type: string, enum: [good, warn, bad]}
    AdvisorInput:
      type: object
      required: [question]
      properties:
        question: {type: string, minLength: 2, maxLength: 500}
        lang: {type: string, enum: [ar, en]}
    AdvisorAnswer:
      type: object
      required: [answer, answerEn, source]
      properties:
        answer: {type: string}
        answerEn: {type: string}
        source: {type: string, enum: [ai, rules]}
    Rates:
      type: object
      required: [base, updated, source, rates]
      properties:
        base: {type: string}
        updated: {type: string}
        source: {type: string}
        rates: {type: object, additionalProperties: {type: number}}

    Listing:
      type: object
      required: [id, name, nameEn, position, age, nationality, nationalityEn, fromClub, fromClubEn, fee, salary, status]
      properties:
        id: {type: string}
        name: {type: string}
        nameEn: {type: string}
        position: {type: string}
        age: {type: integer}
        nationality: {type: string}
        nationalityEn: {type: string}
        fromClub: {type: string}
        fromClubEn: {type: string}
        fee: {type: number}
        salary: {type: number}
        status: {type: string, enum: [available, sold]}
        soldAt: {type: string}
    Payment:
      type: object
      required: [id, kind, ref, description, descriptionEn, amount, status, provider, createdAt, chargeAmount, chargeCurrency]
      properties:
        id: {type: string}
        kind: {type: string, enum: [payroll, transfer, installment, invoice]}
        ref: {type: string}
        description: {type: string}
        descriptionEn: {type: string}
        amount: {type: number}
        status: {type: string, enum: [pending, paid, cancelled, failed]}
        provider: {type: string, enum: [stripe, sandbox]}
        createdAt: {type: string}
        paidAt: {type: string}
        chargeAmount: {type: number}
        chargeCurrency: {type: string}
        reference: {type: string}
    WalletEntry:
      type: object
      required: [id, playerId, date, amount, kind, description, descriptionEn]
      properties:
        id: {type: string}
        playerId: {type: string}
        date: {type: string}
        amount: {type: number}
        kind: {type: string, enum: [salary, withdrawal, advance]}
        description: {type: string}
        descriptionEn: {type: string}
    Wallet:
      type: object
      required: [balance, entries, totalHeld]
      properties:
        balance: {type: number}
        totalHeld: {type: number}
        entries: {type: array, items: {$ref: "#/components/schemas/WalletEntry"}}
    CheckoutInput:
      type: object
      required: [kind, returnUrl]
      properties:
        kind: {type: string, enum: [payroll, transfer, installment]}
        month: {type: string}
        listingId: {type: string}
        plan: {type: string, enum: [full, installments]}
        installmentId: {type: string}
        returnUrl: {type: string}
    CheckoutResult:
      type: object
      required: [paymentId, provider, amount, chargeAmount, chargeCurrency]
      properties:
        paymentId: {type: string}
        provider: {type: string, enum: [stripe, sandbox]}
        url: {type: string}
        amount: {type: number}
        chargeAmount: {type: number}
        chargeCurrency: {type: string}
    ConfirmInput:
      type: object
      properties:
        sessionId: {type: string}
    WithdrawInput:
      type: object
      required: [amount]
      properties:
        amount: {type: number, exclusiveMinimum: 0}
    Invoice:
      type: object
      required: [id, sponsor, description, amount, due, status, createdAt, token]
      properties:
        id: {type: string}
        sponsor: {type: string}
        description: {type: string}
        amount: {type: number}
        due: {type: string}
        status: {type: string, enum: [open, paid, void]}
        createdAt: {type: string}
        paidAt: {type: string}
        token: {type: string}
    InvoiceInput:
      type: object
      required: [sponsor, description, amount, due]
      properties:
        sponsor: {type: string, minLength: 2}
        description: {type: string, minLength: 2}
        amount: {type: number, exclusiveMinimum: 0}
        due: {type: string}
    PublicInvoice:
      type: object
      required: [id, club, clubEn, sponsor, description, amount, due, status, gateway]
      properties:
        id: {type: string}
        club: {type: string}
        clubEn: {type: string}
        sponsor: {type: string}
        description: {type: string}
        amount: {type: number}
        due: {type: string}
        status: {type: string, enum: [open, paid, void]}
        gateway: {type: string, enum: [stripe, sandbox]}
        paidAt: {type: string}
    PublicCheckoutInput:
      type: object
      required: [token, returnUrl]
      properties:
        token: {type: string}
        returnUrl: {type: string}
    PublicConfirmInput:
      type: object
      required: [token, paymentId]
      properties:
        token: {type: string}
        paymentId: {type: string}
        sessionId: {type: string}
    Installment:
      type: object
      required: [id, listingId, playerName, playerNameEn, n, of, amount, due, status]
      properties:
        id: {type: string}
        listingId: {type: string}
        playerName: {type: string}
        playerNameEn: {type: string}
        n: {type: integer}
        of: {type: integer}
        amount: {type: number}
        due: {type: string}
        status: {type: string, enum: [scheduled, paid]}
